<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<title>TIA COFFRE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
:root{
 --bg:#0d0d14;--bg2:#1a1a30;--blue:#1f6bff;--cyan:#2ad4ff;--gold:#ffc21a;--ink:#eaf1ff;--mut:#8ea3d6;
 --glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--veil:rgba(3,8,24,.78);--red:#ff4766;
 --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
 --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
 color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#eef3ff;--bg2:#d3e0ff;--ink:#0b1b4d;--mut:#4d62a0;--glass:rgba(255,255,255,.78);--line:rgba(10,40,120,.16);--veil:rgba(232,239,255,.86);color-scheme:light}}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,select,button{font:inherit;color:inherit}
.hidden{display:none!important}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg))}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.42;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#1f6bff;left:-25vmax;top:-20vmax}
.aurora i:nth-child(2){background:#2ad4ff;right:-30vmax;top:30vh;animation-delay:-6s;opacity:.28}
.aurora i:nth-child(3){background:#ffb300;left:10vmax;bottom:-35vmax;animation-delay:-11s;opacity:.18}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 120px)}
.top{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:14px;box-shadow:0 6px 22px rgba(232,113,10,.55);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
.brand{flex:1;line-height:1.1}
.brand b{font-size:22px;letter-spacing:.5px;font-weight:900}
.brand b span{background:linear-gradient(90deg,var(--gold),#ffe27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.search{margin:18px 0 10px}
.search input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);outline:none;-webkit-user-select:text;user-select:text;backdrop-filter:blur(10px)}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(42,212,255,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.chips button.on{background:linear-gradient(135deg,var(--blue),#0a46d8);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(31,107,255,.45)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border-radius:20px;overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);cursor:pointer;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms);transition:transform .18s}
.card:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
.card .th{position:relative;aspect-ratio:4/3;background:#0003}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:99px;background:var(--veil);font-size:12px;backdrop-filter:blur(6px)}
.card .rv{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:99px;background:linear-gradient(135deg,var(--gold),#ffa800);color:#0b1b4d;font-size:11px;font-weight:800}
.card .tx{padding:10px 12px 12px}
.card .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tx small{color:var(--mut);font-size:12px}
.empty{text-align:center;padding:48px 20px;color:var(--mut);animation:rise .6s both}
.empty .big{width:130px;height:130px;margin:0 auto 18px;border-radius:34px;animation:float 3.5s ease-in-out infinite;box-shadow:0 14px 50px rgba(232,113,10,.55)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:19px}
.copy{text-align:center;color:var(--mut);font-size:12px;margin-top:32px;line-height:1.6}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 20px);z-index:20;display:flex;align-items:center;gap:10px;padding:16px 30px;border:0;border-radius:99px;background:linear-gradient(135deg,#ffd54a,#ffab00);color:#0b1b4d;font-weight:900;font-size:17px;cursor:pointer;animation:fabp 2.6s infinite;transition:scale .15s}
.fab:active{scale:.94}
@keyframes fabp{0%{box-shadow:0 10px 30px rgba(255,171,0,.5),0 0 0 0 rgba(255,194,26,.55)}70%,100%{box-shadow:0 10px 30px rgba(255,171,0,.5),0 0 0 22px rgba(255,194,26,0)}}
.ov{position:fixed;inset:0;z-index:50;opacity:0;transition:opacity .28s,transform .28s;transform:translateY(16px)}
.ov.in{opacity:1;transform:none}
.editor{display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 14px 10px}
.bar h2{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;overflow:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.foot{display:flex;gap:10px;padding:10px 14px calc(var(--sab) + 14px)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--blue),#0a46d8);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(31,107,255,.45)}
.btn.danger{background:linear-gradient(135deg,#ff5a75,#d81e42);border-color:transparent;color:#fff}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:6px 0}
.cwrap{display:flex;justify-content:center}
.cropbox{position:relative;display:inline-block;touch-action:none;line-height:0;margin:16px}
.cropbox img{max-width:calc(100vw - 64px);max-height:56vh;display:block;border-radius:6px;pointer-events:none}
.cropbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cropbox polygon{fill:rgba(42,212,255,.15);stroke:var(--gold);stroke-width:2.5px;vector-effect:non-scaling-stroke}
.h{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--gold);background:rgba(255,194,26,.25);touch-action:none;box-shadow:0 0 0 4px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.5)}
.ew{position:relative;display:flex;justify-content:center;border-radius:18px;overflow:hidden;background:repeating-conic-gradient(#0000 0 25%,rgba(128,150,220,.12) 0 50%) 0 0/20px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.ew img{max-width:100%;max-height:54vh;display:block}
.busy{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(5,11,31,.45);backdrop-filter:blur(2px)}
.busy.on{display:flex}
.busy span{margin:16px;padding:8px 14px;border-radius:99px;background:var(--veil);font-size:13px;font-weight:600}
.laser{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 26px 9px rgba(42,212,255,.65);animation:laser 1.3s ease-in-out infinite alternate}
@keyframes laser{to{top:calc(100% - 3px)}}
.modes{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
.modes button.on{background:linear-gradient(135deg,var(--gold),#ffab00);color:#0b1b4d;border-color:transparent;box-shadow:0 6px 18px rgba(255,171,0,.4)}
.sides{display:flex;gap:12px;margin-bottom:16px}
.sd{position:relative;flex:1;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.sd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sd b{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:99px;background:var(--veil);font-size:12px}
.sd.add{border-style:dashed;color:var(--cyan)}
.sd.add b{position:static;background:none;font-size:13px}
.sd .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--veil);display:grid;place-items:center;cursor:pointer}
.fl{display:block;margin:12px 0;font-size:13px;color:var(--mut);font-weight:600}
.fl input,.fl select,.nrow input,.nrow select{width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:none;-webkit-user-select:text;user-select:text}
.fl select option,.nrow select option{color:#111}
.fl input:focus,.nrow input:focus{border-color:var(--cyan)}
.sec{margin:20px 0 6px;font-size:14px;color:var(--gold);letter-spacing:.4px}
.nrow{display:grid;grid-template-columns:1.1fr 1.2fr 88px 36px;gap:6px;align-items:end;margin-bottom:8px;animation:rise .35s both}
.nrow input,.nrow select{margin-top:0;padding:12px 10px;font-size:14px}
.nrow .x{height:44px;border:0;background:none;color:var(--red);cursor:pointer}
.addn{flex:none;width:100%;margin-top:6px;color:var(--cyan)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:none;font-weight:700;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--blue),#0a46d8);color:#fff}
.imgbox{position:relative;border-radius:18px;overflow:hidden;background:#0004;box-shadow:0 14px 44px rgba(0,0,0,.4);cursor:zoom-in;animation:rise .4s both}
.imgbox img{width:100%;display:block}
.zb{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--veil);font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.meta{margin:14px 2px 4px;color:var(--mut);font-size:14px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.nitem span{color:var(--mut);font-size:13px;flex:1}
.nitem b{font-size:16px;letter-spacing:.8px;-webkit-user-select:text;user-select:text}
.nitem i{font-style:normal;color:var(--cyan);font-size:12px}
.act{gap:8px}
.act button{flex-direction:column;gap:5px;font-size:12px;padding:12px 4px}
.act .del{color:var(--red)}
.sheetov,.dlgov{background:rgba(2,6,20,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.dlgov{align-items:center;padding:24px}
.sh{width:100%;max-width:560px;padding:18px 16px calc(var(--sab) + 16px);border-radius:26px 26px 0 0;background:var(--bg);border:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sh h3{margin:2px 6px 12px;font-size:17px}
.shbtn{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:left;font-weight:700;cursor:pointer}
.shbtn small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.shbtn svg{color:var(--cyan);flex:none}
.shbtn.cancel{justify-content:center;background:none;color:var(--mut)}
.aboutp{margin:10px 4px 0;text-align:center;color:var(--mut);font-size:12px;line-height:1.6}
.dlg{width:100%;max-width:360px;padding:26px 22px 20px;border-radius:26px;background:var(--bg);border:1px solid var(--line);text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.dlg .dic{width:60px;height:60px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(255,71,102,.16);color:var(--red)}
.dlg h3{margin:0 0 8px}.dlg p{margin:0 0 20px;color:var(--mut);font-size:14px;line-height:1.5}
.dlg .row{display:flex;gap:10px}
.viewer{background:#000;z-index:70}
.vstage{position:absolute;inset:0;touch-action:none;overflow:hidden}
.vstage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.vclose{position:absolute;top:calc(var(--sat) + 12px);right:14px;background:rgba(20,20,30,.7);color:#fff}
.vtools{position:absolute;bottom:calc(var(--sab) + 26px);left:50%;transform:translateX(-50%);display:flex;gap:10px}
.vtools .icon-btn{background:rgba(20,20,30,.7);color:#fff;font-size:22px}
.vhint{position:absolute;bottom:calc(var(--sab) + 84px);width:100%;text-align:center;color:#fff9;font-size:12px;margin:0;pointer-events:none}
.lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg));padding:20px}
.lock .llogo{width:88px;height:88px;border-radius:24px;box-shadow:0 10px 40px rgba(232,113,10,.6);animation:float 3.5s ease-in-out infinite}
.lock h2{margin:14px 0 0}.lock p{margin:0;color:var(--mut);font-size:14px}
.dots{display:flex;gap:16px;margin:22px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);transition:.15s}
.dots i.on{background:var(--gold);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:26px;font-weight:700;cursor:pointer;transition:.12s}
.pad button:active{background:var(--blue);color:#fff;transform:scale(.92)}
.lock .link{margin-top:16px;border:0;background:none;color:var(--cyan);font-weight:700;cursor:pointer;padding:10px}
.lock.shake .dots{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg));animation:splashout .5s 1.15s forwards}
#splash img{width:132px;height:132px;border-radius:34px;animation:zoomin 1s cubic-bezier(.2,1.2,.3,1) both;box-shadow:0 0 70px rgba(232,113,10,.8)}
#splash b{font-size:26px;letter-spacing:3px;animation:rise .8s .4s both}
@keyframes zoomin{from{transform:scale(.3) rotate(-12deg);opacity:0}}
@keyframes splashout{to{opacity:0;visibility:hidden}}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);z-index:300;transform:translate(-50%,20px);padding:12px 20px;border-radius:99px;background:var(--veil);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== Interface « Portefeuille » ===== */
.aurora i{opacity:.2}
:root{--btn:#fff;--btnink:#0d0d14}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--btn:#0d0d14;--btnink:#fff}}
.fab{left:50%;width:min(648px,calc(100% - 32px));justify-content:center;border-radius:18px;background:var(--btn);color:var(--btnink);padding:17px 20px;font-size:16px;animation:none;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.stack{display:flex;flex-direction:column;padding:6px 0 0}
.wcard{position:relative;height:190px;margin-top:-108px;border-radius:22px;padding:14px 16px;color:#fff;box-shadow:0 -8px 22px rgba(0,0,0,.45);cursor:pointer;overflow:hidden;transition:height .4s cubic-bezier(.2,.8,.2,1),margin-top .4s cubic-bezier(.2,.8,.2,1);animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}
.wcard:first-child{margin-top:0}
.wcard.sel{height:330px}
.wcard.sel + .wcard{margin-top:12px}
.wcard.dk{color:#1d1300}
.wcard .wh{display:flex;align-items:flex-start;gap:10px}
.wcard .e{font-size:26px;line-height:1}
.wcard .t{flex:1;min-width:0}
.wcard .t b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .t small{opacity:.82;font-size:12px}
.wcard .wr{flex:none;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.28);color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px}
.wcard .wn{margin-top:9px;font-size:13px;font-weight:700;letter-spacing:1.4px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wm{position:absolute;right:14px;bottom:8px;font-size:64px;opacity:.16;pointer-events:none}
.wx{animation:rise .4s both}
.wp{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-top:12px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.wb{display:flex;gap:8px;margin-top:10px}
.wb button{flex:1;padding:12px;border:0;border-radius:14px;background:rgba(255,255,255,.93);color:#0d0d14;font-weight:800;font-size:14px;cursor:pointer}

/* ===== v1.1 : slides, groupes, paramètres ===== */
:root[data-theme="light"]{--bg:#eef3ff;--bg2:#d3e0ff;--ink:#0b1b4d;--mut:#4d62a0;--glass:rgba(255,255,255,.78);--line:rgba(10,40,120,.16);--veil:rgba(232,239,255,.86);--btn:#0d0d14;--btnink:#fff;color-scheme:light}
.pgh{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.pgb{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:24px;line-height:1;cursor:pointer;transition:transform .15s}
.pgb:active{transform:scale(.9)}
.pgt{flex:1;text-align:center}.pgt b{display:block;font-size:18px}.pgt small{color:var(--mut);font-size:12px}
.dotsp{display:flex;justify-content:center;gap:7px;margin:8px 0 14px}
.dotsp i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .3s;cursor:pointer}
.dotsp i.on{width:24px;background:var(--gold)}
.pager{overflow:hidden;touch-action:pan-y}
.track{display:flex;align-items:flex-start;will-change:transform}
.slide{flex:0 0 100%;min-width:0}
.track:not(.live) .slide:not(.act){height:0;overflow:hidden;visibility:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px;font-weight:800;font-size:15px}
.grp:first-child .gh{margin-top:4px}
.gh em{font-style:normal;background:var(--glass);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-size:12px;color:var(--mut)}
.wcard{height:170px;margin-top:-102px}
.wcard.sel{height:320px}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:left;cursor:pointer}
.srow>span{flex:1;font-weight:700;font-size:15px}
.srow small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.srow em{font-style:normal;color:var(--cyan);font-size:13px;font-weight:700}
.srow svg{color:var(--cyan);flex:none}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.25s;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{background:var(--blue)}.sw.on::after{left:21px}
.inter{text-align:center;padding:40px 10px;animation:rise .4s both}

(function(){let sx=null,sy=0,st=0,dec=0;

/* ---------- Moteur de vision (100 % hors ligne) ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x}
function homog(D,S){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=D[i],[X,Y]=S[i];A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y)}return solve(A,b)}
function detectQuad(src){
 const fallback=[[.06,.06],[.94,.06],[.94,.94],[.06,.94]];
 try{
 const s=Math.min(1,260/Math.max(src.width,src.height)),w=Math.max(16,Math.round(src.width*s)),h=Math.max(16,Math.round(src.height*s));
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
 const bw=Math.max(2,Math.round(Math.min(w,h)*.04)),R=[],G=[],B=[];
 for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(xx<bw||y<bw||xx>=w-bw||y>=h-bw){const i=(y*w+xx)*4;R.push(d[i]);G.push(d[i+1]);B.push(d[i+2])}
 const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]},mr=med(R),mg=med(G),mb=med(B);
 const dist=new Uint8Array(w*h),hist=new Uint32Array(256);
 for(let i=0;i<w*h;i++){const v=Math.min(255,Math.hypot(d[i*4]-mr,d[i*4+1]-mg,d[i*4+2]-mb)*.75);dist[i]=v;hist[v|0]++}
 const tot=w*h;let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
 let sB=0,wB=0,mx=0,th=30;for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;th=t}}
 th=Math.max(th,18);
 const lab=new Int32Array(tot),st=new Int32Array(tot);let best=0,bestL=0,L=0;
 for(let i=0;i<tot;i++){if(dist[i]>th&&!lab[i]){L++;let sp=0,cnt=0;st[sp++]=i;lab[i]=L;
  while(sp){const p=st[--sp];cnt++;const px=p%w,py=(p/w)|0;
   if(px>0&&dist[p-1]>th&&!lab[p-1]){lab[p-1]=L;st[sp++]=p-1}
   if(px<w-1&&dist[p+1]>th&&!lab[p+1]){lab[p+1]=L;st[sp++]=p+1}
   if(py>0&&dist[p-w]>th&&!lab[p-w]){lab[p-w]=L;st[sp++]=p-w}
   if(py<h-1&&dist[p+w]>th&&!lab[p+w]){lab[p+w]=L;st[sp++]=p+w}}
  if(cnt>best){best=cnt;bestL=L}}}
 if(best/tot<.12||best/tot>.97)return fallback;
 let tl=[0,1e9],tr=[0,-1e9],br=[0,-1e9],bl=[0,1e9];
 const P={tl:null,tr:null,br:null,bl:null};
 for(let i=0;i<tot;i++)if(lab[i]===bestL){const px=i%w,py=(i/w)|0,a=px+py,b=px-py;
  if(a<tl[1]){tl=[0,a];P.tl=[px,py]}if(a>br[1]){br=[0,a];P.br=[px,py]}if(b>tr[1]){tr=[0,b];P.tr=[px,py]}if(b<bl[1]){bl=[0,b];P.bl=[px,py]}}
 const q=[P.tl,P.tr,P.br,P.bl].map(p=>[Math.min(1,Math.max(0,(p[0]+.5)/w)),Math.min(1,Math.max(0,(p[1]+.5)/h))]);
 let area=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];area+=a[0]*b[1]-b[0]*a[1]}
 if(Math.abs(area)/2<.12)return fallback;
 return q;
 }catch(e){return fallback}}
function warp(src,P){
 const W=src.width,H=src.height,q=P.map(p=>[p[0]*W,p[1]*H]),D=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 let ow=Math.round((D(q[0],q[1])+D(q[3],q[2]))/2),oh=Math.round((D(q[0],q[3])+D(q[1],q[2]))/2);

 stage.oninput=sync;stage.onchange=sync;
 stage.onclick=e=>{if(e.target.closest('[data-rm]')){done('rm');return}if(e.target.closest('[data-verso]'))done('verso')};
 $('#bNo',foot).onclick=()=>done('cancel');$('#bSave',foot).onclick=()=>done('save');ov.onCancel=()=>done('cancel')})}
async function persist(){
 const d={id:E.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),
  name:(E.name||'').trim()||E.type,type:E.type,created:E.created,updated:Date.now(),
  sides:E.sides.map(s=>({orig:s.orig,img:s.img,mode:s.mode})),
  numbers:E.numbers||[],
  thumb:await makeThumb(E.sides[0].img)};
 await DB.put(d);const i=DOCS.findIndex(x=>x.id===d.id);if(i>=0)DOCS[i]=d;else DOCS.unshift(d);render();return d}
async function formLoop(ov){
 while(true){
  const r=await stepForm(ov);
  if(r==='verso'){const b=await choosePick();if(b){const s=await captureSide(ov,b);if(s)E.sides[1]=s}continue}
  if(r==='rm'){E.sides.length=1;continue}
  if(r==='save'){await persist();toast('Document enregistré dans le coffre');return true}
  return false}}
function versoStep(ov,src){return new Promise(res=>{
 $('#eTitle',ov).textContent='Verso';
 $('#eStage',ov).innerHTML=`<div class="inter"><div class="ico">${ic('rot',40)}</div><h3>Recto enregistré ✓</h3><p>Retournez maintenant votre document pour capturer le <b>verso</b>.</p></div>`;
 $('#eFoot',ov).innerHTML=`<button class="btn" id="vNo">Sans verso</button><button class="btn pri" id="vGo">${ic(src==='cam'?'cam':'image',18)} ${src==='cam'?'Photographier le verso':'Choisir le verso'}</button>`;
 ov.onCancel=()=>res(null);$('#vNo',ov).onclick=()=>res(null);$('#vGo',ov).onclick=async()=>res(await pickImage(src))})}
async function newScan(){
 const mode=await sheet('Nouveau document',[{ic:'cam',t:'Recto + verso',s:'Les deux faces en un seul ajout',v:'two'},{ic:'file',t:'Une seule face',s:'Passeport, diplôme, extrait…',v:'one'}]);if(!mode)return;
 const src=await sheet('Source de l’image',[{ic:'cam',t:'Prendre une photo',s:'Détection et scan automatiques',v:'cam'},{ic:'image',t:'Depuis la galerie',s:'Importer une image existante',v:'gal'}]);if(!src)return;
 const blob=await pickImage(src);if(!blob)return;
 const ov=openEditor();E={id:null,name:'',type:TYPES[0],created:Date.now(),sides:[],numbers:[]};
 try{const s=await captureSide(ov,blob);
  if(s){E.sides.push(s);
   if(mode==='two'){const b2=await versoStep(ov,src);if(b2){const s2=await captureSide(ov,b2);if(s2)E.sides.push(s2)}}
   await formLoop(ov)}}
 catch(err){console.error(err);toast('Une erreur est survenue pendant le scan')}
 closeLayer(ov)}
async function editDoc(doc){
 E={id:doc.id,name:doc.name,type:doc.type,created:doc.created,sides:doc.sides.map(s=>({...s})),numbers:(doc.numbers||[]).map(n=>({...n}))};
 const ov=openEditor();try{await formLoop(ov)}catch(err){console.error(err);toast('Enregistrement impossible')}closeLayer(ov)}
async function reEnhance(doc,si){
 const ov=openEditor();
 try{const src=await blobToCanvas(doc.sides[si].orig,2200),r=await enhanceStep(ov,src,doc.sides[si].mode||'auto');
  if(r){doc.sides[si].img=r.blob;doc.sides[si].mode=r.mode;if(si===0)doc.thumb=await makeThumb(r.blob);doc.updated=Date.now();await DB.put(doc);render();toast('Qualité améliorée')}}
 catch(err){console.error(err);toast('Amélioration impossible')}
 closeLayer(ov)}

/* ---------- Fiche document ---------- */
function openDetail(id){
 if(!DOCS.find(x=>x.id===id))return;let si=0,urls=[];
 const ov=openLayer(`<div class="bar"><button class="icon-btn" data-x>${ic('back')}</button><h2 id="dT"></h2><button class="icon-btn" data-a="edit" aria-label="Modifier">${ic('edit',20)}</button></div><div class="stage" id="dS"></div><div class="foot act" id="dF"></div>`,'editor');
 const cur=()=>DOCS.find(x=>x.id===id);
 const base=ov.onCancel;ov.onCancel=()=>{urls.forEach(u=>URL.revokeObjectURL(u));base()};
 const draw=()=>{const doc=cur();if(!doc){ov.onCancel();return}
  urls.forEach(u=>URL.revokeObjectURL(u));urls=doc.sides.map(s=>URL.createObjectURL(s.img));if(si>=doc.sides.length)si=0;
  $('#dT',ov).textContent=doc.name;
  $('#dS',ov).innerHTML=`${doc.sides.length>1?`<div class="tabs"><button class="${si===0?'on':''}" data-t="0">Recto</button><button class="${si===1?'on':''}" data-t="1">Verso</button></div>`:''}
   <div class="imgbox" data-a="zoom"><img src="${urls[si]}" alt="${esc(doc.name)}"><span class="zb">${ic('expand',14)} Agrandir</span></div>
   <div class="meta">${EMO[doc.type]||'📁'} ${esc(doc.type)} · ajouté le ${fmtDate(doc.created)}</div>`;
  $('#dF',ov).innerHTML=`<button class="btn" data-a="zoom">${ic('expand',22)}Agrandir</button><button class="btn" data-a="enh">${ic('wand',22)}Améliorer IA</button><button class="btn" data-a="share">${ic('share',22)}Partager</button><button class="btn del" data-a="del">${ic('trash',22)}Supprimer</button>`};
 ov.addEventListener('click',async e=>{
  const doc=cur();if(!doc)return;
  const t=e.target.closest('[data-t]');if(t){si=+t.dataset.t;draw();return}
  const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
  if(k==='zoom')openViewer(urls[si]);
  else if(k==='share')shareDoc(doc);
  else if(k==='enh'){await reEnhance(doc,si);draw()}
  else if(k==='edit'){await editDoc(doc);draw()}
  else if(k==='del'){
   const ok=await confirmBox({title:'Supprimer ce document ?',text:'« '+esc(doc.name)+' » sera définitivement effacé de votre coffre. Cette action est irréversible.',ok:'Supprimer',danger:true});
   if(ok){await DB.del(doc.id);DOCS=DOCS.filter(x=>x.id!==doc.id);render();ov.onCancel();toast('Document supprimé')}}});
 draw()}

/* ---------- Verrouillage : code + empreinte ---------- */
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tia-coffre:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function bioPlugin(){const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;return(C.Plugins&&C.Plugins.BiometricAuth)||(C.registerPlugin&&C.registerPlugin('BiometricAuth'))||null}
async function bioAvailable(){const B=bioPlugin();if(!B)return false;try{const r=await B.checkBiometry();return !!r.isAvailable}catch(e){return false}}
async function bioAuth(reason){const B=bioPlugin();if(!B)return false;
 try{await withLock(()=>B.authenticate({reason,cancelTitle:'Utiliser le code',allowDeviceCredential:false,androidTitle:'TIA COFFRE',androidSubtitle:reason,androidConfirmationRequired:false}));return true}catch(e){return false}}
function pinPad(title,sub,canSkip,verify,bio){return new Promise(res=>{
 let v='',busy=false;const useBio=!!bio&&!!bioPlugin();
 const d=el(`<div class="lock"><img class="llogo" src="icon.png" alt=""><h2>${title}</h2><p>${sub}</p><div class="dots"><i></i><i></i><i></i><i></i></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>${useBio?'<button class="link" data-bio>👆 Utiliser l’empreinte digitale</button>':''}${canSkip?'<button class="link" data-skip>Plus tard</button>':''}<p style="margin-top:18px;font-size:12px">© 2026 TIA COFFRE</p></div>`);
 document.body.appendChild(d);const dots=[...d.querySelectorAll('.dots i')],paint=()=>dots.forEach((x,i)=>x.classList.toggle('on',i<v.length));
 const tryBio=async()=>{if(busy)return;busy=true;const ok=await bioAuth('Déverrouiller TIA COFFRE');busy=false;if(ok){d.remove();res('bio')}};
 d.onclick=async e=>{
  if(e.target.closest('[data-skip]')){d.remove();res(null);return}
  if(e.target.closest('[data-bio]')){tryBio();return}
  const b=e.target.closest('[data-k]');if(!b||busy)return;const k=b.dataset.k;
  if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;paint();
  if(v.length===4){busy=true;const ok=verify?await verify(v):true;
   if(ok){d.remove();res(v)}else{d.classList.add('shake');if(navigator.vibrate)navigator.vibrate(80);setTimeout(()=>{d.classList.remove('shake');v='';paint();busy=false},450)}}};
 if(useBio)setTimeout(tryBio,400)})}
async function setPin(canSkip){
 const a=await pinPad('Créer un code','Choisissez 4 chiffres pour verrouiller le coffre',canSkip);if(!a)return false;
 await pinPad('Confirmer le code','Saisissez-le une seconde fois',false,async c=>c===a);
 localStorage.setItem('tia_pin',await hashPin(a));toast('Code enregistré');return true}
async function checkPin(){const h=localStorage.getItem('tia_pin');return pinPad('Code actuel','Entrez votre code actuel',false,async c=>await hashPin(c)===h)}
function lockNow(){const h=localStorage.getItem('tia_pin');return pinPad('Coffre verrouillé',bioPlugin()&&SET.bio?'Code ou empreinte digitale':'Entrez votre code',false,async c=>await hashPin(c)===h,SET.bio)}
async function startupLock(){
 try{if(localStorage.getItem('tia_pin'))await lockNow();
  else if(!localStorage.getItem('tia_pinAsked')){localStorage.setItem('tia_pinAsked','1');await setPin(true)}}catch(e){console.error(e)}}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=Date.now();return}
 if(!hiddenAt||noLock>0||SET.lock<0||!localStorage.getItem('tia_pin')||$('.lock'))return;
 if(Date.now()-hiddenAt>=SET.lock)lockNow()});

/* ---------- Données : import, sauvegarde, restauration ---------- */
const guessType=n=>/cni|identit|carte nat/i.test(n)?TYPES[0]:/naissance|extrait/i.test(n)?TYPES[1]:/dipl/i.test(n)?TYPES[2]:/passeport|passport/i.test(n)?TYPES[3]:/permis/i.test(n)?TYPES[4]:/grise/i.test(n)?TYPES[5]:/assur/i.test(n)?TYPES[6]:/sant[eé]|carnet/i.test(n)?TYPES[7]:TYPES[8];
async function importPhotos(){
 const files=await pickFiles('image/*',true);if(!files.length)return;
 const groups=new Map();
 for(const f of files){const nm=f.name.replace(/\.[^.]+$/,''),m=nm.match(/^(.*?)[-_ ]*(recto|verso)$/i),key=(m&&m[1])||nm,side=m&&/verso/i.test(m[2])?1:0;if(!groups.has(key))groups.set(key,[]);groups.get(key).push({f,side})}
 toast('Import en cours…');let n=0;
 for(const [key,arr] of groups){try{arr.sort((a,b)=>a.side-b.side);const sides=[];
  for(const a of arr.slice(0,2)){const b=await toBlob(await blobToCanvas(a.f,2200),.93);sides.push({orig:b,img:b,mode:'orig'})}
  const name=key.replace(/_+/g,' ').trim()||'Document',d={id:uid(),name,type:guessType(name),created:Date.now(),updated:Date.now(),sides,numbers:[],thumb:await makeThumb(sides[0].img)};
  await DB.put(d);DOCS.unshift(d);n++}catch(e){console.error(e)}}
 render();toast(n+' document'+(n>1?'s':'')+' importé'+(n>1?'s':''))}
async function backup(){
 if(!DOCS.length){toast('Aucun document à sauvegarder');return}
 toast('Préparation de la sauvegarde…');
 const out=[];for(const d of DOCS)out.push({...d,sides:await Promise.all(d.sides.map(async s=>({mode:s.mode,orig:await b64(s.orig),img:await b64(s.img)})))});
 const blob=new Blob([JSON.stringify({app:'TIA COFFRE',v:1,date:Date.now(),docs:out})],{type:'application/json'});
 try{await shareFiles([{blob,name:'TIA-COFFRE-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json'}],'Sauvegarde TIA COFFRE')}
 catch(e){const m=String((e&&(e.message||e.name))||e);if(!/cancel|abort/i.test(m))toast('Sauvegarde impossible')}}
async function restore(){
 const [f]=await pickFiles('application/json,.json',false);if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.app!=='TIA COFFRE'||!Array.isArray(j.docs))throw 0;
  const toB=x=>fetch('data:image/jpeg;base64,'+x).then(r=>r.blob());let n=0;
  for(const d of j.docs){const sides=[];for(const s of d.sides)sides.push({mode:s.mode,orig:await toB(s.orig),img:await toB(s.img)});
   const nd={...d,sides};await DB.put(nd);const i=DOCS.findIndex(x=>x.id===nd.id);if(i>=0)DOCS[i]=nd;else DOCS.unshift(nd);n++}
  render();toast(n+' document'+(n>1?'s':'')+' restauré'+(n>1?'s':''))}
 catch(e){toast('Fichier de sauvegarde invalide')}}

/* ---------- Paramètres ---------- */
const LOCKS={0:'Immédiat','60000':'Après 1 minute','300000':'Après 5 minutes','-1':'Jamais'};
const THEMES={auto:'Automatique',dark:'Sombre',light:'Clair'};
function openSettings(){
 const ov=openLayer(`<div class="bar"><button class="icon-btn" data-x>${ic('back')}</button><h2>Paramètres</h2></div><div class="stage" id="sS"></div>`,'editor');
 const row=(i,t,sub,val,k)=>`<button class="srow" data-s="${k}">${ic(i,20)}<span>${t}${sub?`<small>${sub}</small>`:''}</span>${val==null?'':`<em>${val}</em>`}</button>`;
 const draw=()=>{const has=!!localStorage.getItem('tia_pin');
  $('#sS',ov).innerHTML=`<h4 class="sec">SÉCURITÉ</h4>
  ${row('lock','Code de verrouillage','Code à 4 chiffres',has?'Activé':'Désactivé','pin')}
  <button class="srow" data-s="bio">${ic('lock',20)}<span>Empreinte digitale<small>Déverrouiller avec le capteur du téléphone</small></span><i class="sw ${SET.bio&&has?'on':''}"></i></button>
  ${row('lock','Verrouillage automatique','Quand l’application est quittée',LOCKS[SET.lock],'lockd')}
  <h4 class="sec">APPARENCE</h4>${row('eye','Thème',null,THEMES[SET.theme],'theme')}
  <h4 class="sec">SCAN</h4>${row('wand','Amélioration par défaut','Mode appliqué après chaque scan',MLABEL[SET.defMode],'defm')}
  <h4 class="sec">MES DONNÉES</h4>
  ${row('image','Importer des photos existantes','Recto et verso regroupés si nommés « …-recto » / « …-verso »',null,'imp')}
  ${row('share','Sauvegarder mes documents','Un fichier à garder en lieu sûr',null,'bak')}
  ${row('file','Restaurer une sauvegarde','Retrouver vos documents sur un nouveau téléphone',null,'res')}
  <p class="aboutp">TIA COFFRE · version 1.1<br>© 2026 TIA COFFRE — Tous droits réservés<br>${DOCS.length} document${DOCS.length>1?'s':''} stocké${DOCS.length>1?'s':''} uniquement sur cet appareil.</p>`};
 ov.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s,has=!!localStorage.getItem('tia_pin');
  try{
   if(k==='pin'){if(!has)await setPin(false);else{const c=await sheet('Code de verrouillage',[{ic:'lock',t:'Modifier le code',v:'chg'},{ic:'trash',t:'Retirer le code',s:'Le coffre s’ouvrira sans code',v:'rm'}]);
     if(c==='chg'){await checkPin();await setPin(false)}else if(c==='rm'){await checkPin();localStorage.removeItem('tia_pin');SET.bio=false;saveSet();toast('Code retiré')}}}
   else if(k==='bio'){
    if(SET.bio){SET.bio=false;saveSet()}
    else{if(!has&&!await setPin(true))return;
     if(!bioPlugin()){toast('Empreinte disponible dans l’application Android');return}
     if(!await bioAvailable()){toast('Aucune empreinte enregistrée sur ce téléphone');return}
     if(await bioAuth('Activer l’empreinte digitale')){SET.bio=true;saveSet();toast('Empreinte activée')}}}
   else if(k==='lockd'){const c=await sheet('Verrouillage automatique',Object.keys(LOCKS).map(x=>({ic:'lock',t:LOCKS[x],v:+x})));if(c!=null){SET.lock=c;saveSet()}}
   else if(k==='theme'){const c=await sheet('Thème',Object.keys(THEMES).map(x=>({ic:'eye',t:THEMES[x],v:x})));if(c){SET.theme=c;saveSet();applyTheme()}}
   else if(k==='defm'){const c=await sheet('Amélioration par défaut',MODES.filter(m=>m[0]!=='orig').map(m=>({ic:'wand',t:MLABEL[m[0]],v:m[0]})).concat([{ic:'image',t:'Original',s:'Sans traitement',v:'orig'}]));if(c){SET.defMode=c;saveSet()}}
   else if(k==='imp')await importPhotos();
   else if(k==='bak')await backup();
   else if(k==='res')await restore();
  }catch(err){console.error(err)}
  draw()});
 draw()}
$('#btnSet').onclick=openSettings;

/* ---------- Démarrage ---------- */
$('#fab').onclick=newScan;
(function(){const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
 if(A&&A.addListener)A.addListener('backButton',()=>{if($('.lock'))return;const t=[...layer.children].reverse().find(x=>!x.dataset.closing);if(t&&t.onCancel)t.onCancel();else if(A.exitApp)A.exitApp()})})();
setTimeout(()=>{const s=$('#splash');if(s)s.remove()},1700);
(async()=>{await startupLock();try{await DB.open();DOCS=await DB.all()}catch(e){console.error(e);toast('Stockage local indisponible')}render()})();
</script>
