name: Build TIA COFFRE APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer l'icône depuis assets/icon-only.png
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a2e8f' --iconBackgroundColorDark '#0a2e8f'

      - name: Synchroniser l'application web
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TIA-COFFRE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TIA-COFFRE-APK
          path: TIA-COFFRE.apk

      - name: Publier une release (sur tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TIA-COFFRE.apk
